name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create .env for secrets plugin
        run: |
          echo "REDPILL_API_TOKEN=dummy" > .env
          echo "BOT_TOKEN=dummy" >> .env
          echo "ADMIN_ID=0" >> .env

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle_output.log; exit ${PIPESTATUS[0]}

      - name: Surface compiler errors in the job summary
        if: failure()
        run: |
          {
            echo '### Gradle failure details'
            echo '```'
            grep -E "^e: |^w: .*(error|Error)|FAILURE:|What went wrong|^> Task .* FAILED|Caused by:|^\* " gradle_output.log | head -120
            echo '```'
            echo '### Tail of the build log'
            echo '```'
            tail -60 gradle_output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report compiler errors on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Gradle failure for commit ${{ github.sha }}"
            echo '```'
            grep -E "^e: |FAILURE:|What went wrong|^> Task .* FAILED|Caused by:|error:" gradle_output.log | head -80
            echo '```'
            echo '```'
            tail -40 gradle_output.log
            echo '```'
          } > /tmp/ci_report.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --body-file /tmp/ci_report.md

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-logs
          path: gradle_output.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: redshift-debug-apk
          path: app/build/outputs/apk/debug/*.apk
